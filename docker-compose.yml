version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - wolt-network

  server:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - wolt-network

  webserver:
    build:
      context: .
      dockerfile: src/webserver/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - server
    networks:
      - wolt-network
    environment:
      - MONGO_URI=mongodb://mongo:27017/wolt
      - EX2_HOST=server
      - EX2_PORT=8080

volumes:
  mongo_data:

networks:
  wolt-network:
    driver: bridge