version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - wolt-network

  webserver:
    build:
      context: .
      dockerfile: src/webserver/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - wolt-network
    environment:
      - EX2_HOST=server
      - EX2_PORT=8080

networks:
  wolt-network:
    driver: bridge
